name: Refresh dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"  # weekdays, after the US market close
    - cron: "0 14 * * 6"     # Saturday: recalibrate hold periods
  workflow_dispatch:
    inputs:
      task:
        description: "daily or backtest"
        default: daily

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest
        if: github.event.schedule == '0 14 * * 6' || inputs.task == 'backtest'
        run: python -m tradedash backtest
      - name: Daily refresh
        run: python -m tradedash daily
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Refresh dashboard $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet origin main
          git push
